<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>まるめる ひっぱる — NxPC.Live vol.80</title>
<meta name="description" content="NxPC.Live vol.80 まるめる ひっぱる 2026年12月5日 ソフトピアジャパンセンタービル ギャラリー2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  :root { --bg: #cbcbcb; --ink: #111; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; overscroll-behavior: none; }
  body { font-family: "DotGothic16", ui-monospace, monospace; color: var(--ink); }
  canvas#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }

  #tools { position: fixed; right: 16px; top: max(12px, env(safe-area-inset-top)); display: flex; gap: 6px; }
  #tools button {
    font: inherit; font-size: 11px; letter-spacing: .04em; color: var(--ink); background: transparent;
    border: 1.5px solid var(--ink); border-radius: 999px; padding: 2px 9px; cursor: pointer;
    transition: background .15s, color .15s;
  }
  #tools button:hover { background: var(--ink); color: var(--bg); }
  #tools button:focus-visible { outline: 3px solid #ff7c2a; outline-offset: 2px; }

  #fallback { display: none; position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .no-webgl #fallback { display: block; }
  .no-webgl #stage, .no-webgl #tools { display: none; }

</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
</script>
</head>
<body>
<h1 class="sr">まるめる ひっぱる</h1>
<p class="sr">NxPC.Live vol.80 / 2026年12月5日 / ソフトピアジャパンセンタービル ギャラリー2</p>

<canvas id="stage" aria-label="ケーブルを引っ張ったり丸めたり、挿し替えたりできるインタラクティブなポスター"></canvas>
<img id="fallback" src="assets/poster.jpg" alt="まるめる ひっぱる NxPC.Live vol.80 2026年12月5日 ソフトピアジャパンセンタービル ギャラリー2">

<div id="tools">
  <button id="shuffle" type="button">シャッフル</button>
  <button id="reset" type="button">もとにもどす</button>
</div>

<script type="module" src="main.js"></script>
</body>
</html>
